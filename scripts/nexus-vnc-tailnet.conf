# Phase 3 drop-in for nexus-vnc.service — installed by scripts/sudo_phase3.sh
# to /etc/systemd/system/nexus-vnc.service.d/10-tailnet.conf
#
# x11vnc listens on the tailnet IP only (never 0.0.0.0), password-protected.
# Password file: /home/cwatt250/.vnc/passwd (generated with x11vnc -storepasswd).
# Plaintext copy for the owner: /home/cwatt250/.vnc/nexus-vnc-password.txt (0600).
[Unit]
After=tailscaled.service nexus-xvfb.service

[Service]
ExecStart=
ExecStart=/usr/bin/x11vnc \
    -display :99 \
    -listen 100.124.210.84 \
    -rfbport 5900 \
    -rfbauth /home/cwatt250/.vnc/passwd \
    -forever \
    -shared \
    -noxdamage \
    -quiet
